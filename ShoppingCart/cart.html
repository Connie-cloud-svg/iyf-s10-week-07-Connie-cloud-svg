<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./design.css" />
    <title>My Cart | Taifa Market</title>
  </head>

  <body>
    <nav class="nav">
      <div class="logo">Taifa Market</div>
      <ul class="nav-links">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./cart.html" class="active">My Cart</a></li>
      </ul>
      <a href="./cart.html" class="cart-btn"> Cart 🛍️ </a>
      <span class="cart-count" id="cart-count">0</span>
    </nav>

    <main class="main-content cart-page">
      <div class="cart-header">
        <h2>My Cart</h2>
        <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
      </div>

      <section class="cart-layout">
        <div id="cart-items-col">
          <ul id="cart-list" id="cart-list"></ul>
          <div class="empty-cart" id="empty-cart" style="display: none">
            <div class="empty-cart-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
            </div>
            <p>Your cart is empty</p>
            <p class="empty-cart-message">
              Looks like you haven't added anything to your cart yet.<br />Head
              back to shop and find something you like!
            </p>
            <a href="./index.html" class="shop-link">Start shopping →</a>
          </div>
        </div>

        <aside class="order-summary" id="order-summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Items (<span id="summary-count">0</span>)</span>
            <span id="summary-subtotal">KSh 0</span>
          </div>
          <div class="summary-row summary-total">
            <span>Total</span>
            <span id="summary-total">KSh 0</span>
          </div>
          <button class="checkout-btn">Proceed to Checkout</button>
          <a href="./index.html" class="continue-link">← Continue Shopping</a>
        </aside>
      </section>
    </main>

    <section class="toast" id="toast"></section>
    <script src="./shoppingcart.js"></script>
    <script>
      renderCart();
      updateCartCount();
    </script>
  </body>
</html>
