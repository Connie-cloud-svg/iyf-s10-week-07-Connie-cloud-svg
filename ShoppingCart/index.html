<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel ="stylesheet" href="./design.css">
        <title>Taifa Stores</title>
    </head>

    <body>
        <header class="header">
            <h1>Taifa Market.</h1>
            <p class="subtitle">Your one-stop shop for all your needs!</p>
        </header>

        <nav class="navigation" id="navigation">
            <div class="logo">Taifa Market</div>
            <ul class="nav-list">
                <li class="nav-home" status="active"><a href="./index.html">Home</a></li>
                <li class="nav-cart"><a href="./cart.html">My Cart</a></li>
                <li class="nav-account"><a href="./account.html">Account</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <section class="cart-items">
                <div id="cart-item">
                    <!-- Cart items will be dynamically added here -->
                     <ul id="cart-list">
                        <li class="cart-item">
                            <span class="item-name"></span>
                            <span class="item-price"></span>
                            <button class="add-item" onclick="addItemToCart()">Add to Cart</button>
                            <button class="remove-item" onclick="removeItemFromCart()">Remove</button>
                        </li>
                     </ul>
                </div>
            </section>
        </main>
        <script src="./shoppingcart.js"></script>
    </body>
    
</html>
