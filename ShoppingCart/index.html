<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./design.css" />
    <title>Taifa Stores</title>
  </head>

  <body>
    <nav class="nav">
      <div class="logo">Taifa Market</div>
      <ul class="nav-links">
        <li><a href="./index.html" class="active">Home</a></li>
        <li><a href="./cart.html">My Cart</a></li>
      </ul>
      <a href="./cart.html" class="cart-btn"> 🛒 Cart
        <span class="cart-count" id="cart-count">0</span>
      </a>
      <button id="theme-switch">
        <i class="fa-solid fa-sun "></i>
        <i class="fa-solid fa-moon "></i> 
      </button>
    </nav>

    <header class="hero">
      <div class="hero-text">
        <p class="hero-subtitle">Fresh. Local. Yours.</p>
        <h1>Taifa Market</h1>
        <p class="hero-description">
          Your one stop online market for all your needs.
        </p>
      </div>
      <div class="hero-badge">Est. 2026</div>
    </header>

    <main class="main-content">
      <section class="section-header">
        <h2>Our products</h2>
        <span class="product-count" id="product-count"></span>
      </section>
      <div class="product-grid" id="product-grid"></div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Taifa Market. All Rights Reserved.</p>
      <section class="footer-socials">
        <a
          href="https://github.com/Connie-cloud-svg"
          target="_blank"
          title="GitHub"
        >
          <i class="fa-brands fa-github"></i>
        </a>
        <a
          href="https://instagram.com/_its_just_connie"
          target="_blank"
          title="Instagram"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a
          href="https://www.linkedin.com/in/concepterbosibori"
          target="_blank"
          title="LinkedIn"
        >
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="https://x.com/Connie_cloud_svg" target="_blank" title="X">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </section>
    </footer>
    <script src="./shoppingcart.js"></script>
    <script>
      renderProducts();
      updateCartCount();
    </script>
  </body>
</html>
